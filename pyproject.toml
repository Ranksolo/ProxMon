[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmon"
version = "1.0.0"
description = "Proxmox Desktop Monitor — CPU-Z for your Proxmox server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Cloud Ninja", email = "info@cloudninja.us"},
]
keywords = ["proxmox", "monitoring", "desktop", "widget", "virtualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyQt6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/Ranksolo/ProxMon"
Repository = "https://github.com/Ranksolo/ProxMon"
Issues = "https://github.com/Ranksolo/ProxMon/issues"

[project.scripts]
proxmon = "proxmox_monitor:main"

[project.gui-scripts]
proxmon-gui = "proxmox_monitor:main"
